<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Release pipeline: git push, test, build, provision, deploy, verify">
<title>Release pipeline: git push, test, build, provision, deploy, verify</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff9900"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="1.0" y="40" width="158" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="80.0" y="72" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#e6edf3">git push</text>
<text x="80.0" y="96" text-anchor="middle" font-size="14" fill="#8b949e">Gitea</text><line x1="166.0" y1="78" x2="202.0" y2="78" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/></line>
<rect x="209.0" y="40" width="158" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="288.0" y="72" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#e6edf3">test</text>
<text x="288.0" y="96" text-anchor="middle" font-size="14" fill="#8b949e">Jenkins</text><line x1="374.0" y1="78" x2="410.0" y2="78" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/></line>
<rect x="417.0" y="40" width="158" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="496.0" y="72" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#e6edf3">build</text>
<text x="496.0" y="96" text-anchor="middle" font-size="14" fill="#8b949e">Docker</text><line x1="582.0" y1="78" x2="618.0" y2="78" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/></line>
<rect x="625.0" y="40" width="158" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="704.0" y="72" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#e6edf3">provision</text>
<text x="704.0" y="96" text-anchor="middle" font-size="14" fill="#8b949e">Terraform</text><line x1="790.0" y1="78" x2="826.0" y2="78" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/></line>
<rect x="833.0" y="40" width="158" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="912.0" y="72" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#e6edf3">deploy</text>
<text x="912.0" y="96" text-anchor="middle" font-size="14" fill="#8b949e">ECS · EKS</text><line x1="998.0" y1="78" x2="1034.0" y2="78" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/></line>
<rect x="1041.0" y="40" width="158" height="76" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="1120.0" y="72" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#e6edf3">verify</text>
<text x="1120.0" y="96" text-anchor="middle" font-size="14" fill="#8b949e">health checks</text><circle r="5" fill="#ff9900"><animateMotion dur="6s" repeatCount="indefinite" path="M80.0,78 L1120.0,78"/></circle><text x="600.0" y="144" text-anchor="middle" font-size="14" fill="#8b949e">one push → healthy service in minutes, no hand-edited YAML or .tf files</text>
</svg>
