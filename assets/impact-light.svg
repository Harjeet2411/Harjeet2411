<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Impact: 2,000+ production deployments, 44 AWS accounts, build and deploy cut from 6 hours to minutes, 42k+ resources">
<title>Impact: 2,000+ production deployments, 44 AWS accounts, build and deploy cut from 6 hours to minutes, 42k+ resources</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d97706"/>
    <stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<g>
  <rect x="1.0" y="1" width="283.0" height="168" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="24.0" y="26" width="36" height="4" rx="2" fill="url(#accent)"/>
  <text x="24.0" y="86" font-size="40" font-weight="800" fill="#1f2328">2,000+
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.0s" fill="freeze"/></text>
  <text x="24.0" y="120" font-size="18" font-weight="600" fill="#1f2328">production deployments</text>
  <text x="24.0" y="146" font-size="15" fill="#59636e">shipped on AWS</text>
</g>
<g>
  <rect x="306.0" y="1" width="283.0" height="168" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="329.0" y="26" width="36" height="4" rx="2" fill="url(#accent)"/>
  <text x="329.0" y="86" font-size="40" font-weight="800" fill="#1f2328">44
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/></text>
  <text x="329.0" y="120" font-size="18" font-weight="600" fill="#1f2328">AWS accounts</text>
  <text x="329.0" y="146" font-size="15" fill="#59636e">across multiple regions</text>
</g>
<g>
  <rect x="611.0" y="1" width="283.0" height="168" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="634.0" y="26" width="36" height="4" rx="2" fill="url(#accent)"/>
  <text x="634.0" y="86" font-size="40" font-weight="800" fill="#1f2328">6h → 5–7m
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/></text>
  <text x="634.0" y="120" font-size="18" font-weight="600" fill="#1f2328">build + deploy time</text>
  <text x="634.0" y="146" font-size="15" fill="#59636e">after Jenkins + Terraform</text>
</g>
<g>
  <rect x="916.0" y="1" width="283.0" height="168" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="939.0" y="26" width="36" height="4" rx="2" fill="url(#accent)"/>
  <text x="939.0" y="86" font-size="40" font-weight="800" fill="#1f2328">42k+
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.6s" fill="freeze"/></text>
  <text x="939.0" y="120" font-size="18" font-weight="600" fill="#1f2328">resources</text>
  <text x="939.0" y="146" font-size="15" fill="#59636e">in the largest account</text>
</g>
</svg>
